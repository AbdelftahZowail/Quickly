version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: azowail/quickly:latest
    restart: unless-stopped
    expose:
      - "8000"  # internal only; Caddy proxies to this
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # override DATABASE_URL so users running compose don't have to edit
      # .env; it will point at the db container automatically.
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/quickly"

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    env_file: .env
    depends_on:
      - app

volumes:
  pgdata:
