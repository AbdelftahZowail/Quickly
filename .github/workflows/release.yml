name: Release

permissions:
  contents: write


on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag
        id: tagger
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            azowail/quickly:${{ steps.tagger.outputs.TAG }}
            azowail/quickly:latest
          cache-from: type=registry,ref=azowail/quickly:latest
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tagger.outputs.TAG }}
          release_name: ${{ steps.tagger.outputs.TAG }}
          body: |
            🖥️ **Run locally or on a VPS**

            1. Install Docker Desktop
            2. Download `docker-compose.yml` and `.env.example` from the files below
            3. Rename `.env.example` to `.env` and fill in your API keys
            4. Run `docker compose up`
            5. Open `http://localhost:8000`

            ☁️ **Deploy on Railway / Render**

            1. Create a new project
            2. Deploy image `azowail/quickly:${{ steps.tagger.outputs.TAG }}` from Docker Hub
            3. Add a Postgres plugin
            4. Copy the variables from `.env.example` into your dashboard and fill them in
            5. Done — you'll get a public URL
          draft: false
          prerelease: false

      - name: Upload docker-compose.yml asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: docker-compose.yml
          asset_name: docker-compose.yml
          asset_content_type: application/x-yaml

      - name: Upload .env.example asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .env.example
          asset_name: .env.example
          asset_content_type: text/plain
