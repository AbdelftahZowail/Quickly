name: Release

permissions:
  contents: write


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to simulate (e.g. v1.0.0-test)'
        required: true
        default: 'v0.0.0-test'
      push_image:
        description: 'Push Docker image to Docker Hub'
        type: boolean
        required: false
        default: false
      create_release:
        description: 'Create a GitHub Release (draft)'
        type: boolean
        required: false
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag
        id: tagger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: |
            azowail/quickly:${{ steps.tagger.outputs.TAG }}
            azowail/quickly:latest
          cache-from: type=registry,ref=azowail/quickly:latest
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub Release with assets
        if: github.event_name != 'workflow_dispatch' || inputs.create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tagger.outputs.TAG }}
          name: ${{ steps.tagger.outputs.TAG }}
          artifacts: "docker-compose.yml,.env.example,Caddyfile"
          artifactErrorsFailBuild: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## What's in this release

            Docker image: `azowail/quickly:${{ steps.tagger.outputs.TAG }}`
            Also tagged as: `azowail/quickly:latest`

            ---

            ## Setup Options

            ### 🖥️ Option 1 — Self-hosted VPS (recommended)

            Requires Docker and a domain pointed at your server.

            ```bash
            mkdir quickly && cd quickly
            curl -LO https://github.com/azowail/quickly/releases/latest/download/docker-compose.yml
            curl -LO https://github.com/azowail/quickly/releases/latest/download/Caddyfile
            curl -LO https://github.com/azowail/quickly/releases/latest/download/.env.example
            mv .env.example .env
            # Edit .env — set CADDY_HOST, BASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
            docker compose up -d
            ```

            Caddy handles HTTPS automatically with Let's Encrypt. Open `https://yourdomain.com`.

            **Required env vars:**
            | Variable | Description |
            |---|---|
            | `CADDY_HOST` | Your domain (e.g. `yourdomain.com`) |
            | `BASE_URL` | Full URL with protocol (e.g. `https://yourdomain.com`) |
            | `GOOGLE_CLIENT_ID` | Google OAuth 2.0 client ID |
            | `GOOGLE_CLIENT_SECRET` | Google OAuth 2.0 client secret |

            ---

            ### ☁️ Option 2 — PaaS (Railway, Render, Fly.io, etc.)

            1. Create a new service using Docker image `azowail/quickly:${{ steps.tagger.outputs.TAG }}`
            2. Add a managed PostgreSQL database; set its connection string as `DATABASE_URL`
            3. Set `BASE_URL` to your platform's assigned URL
            4. Set `GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET`
            5. Deploy — no Caddyfile needed (the platform handles HTTPS)

            ---

            ### 🛠️ Option 3 — Local / developer setup

            ```bash
            git clone https://github.com/azowail/quickly.git
            cd quickly
            cp .env.example .env   # fill in GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, BASE_URL
            docker compose -f docker-compose.dev.yml up
            ```

            Or run manually:
            ```bash
            pip install -r requirements.txt
            uvicorn app.main:app --reload   # backend on :8000
            cd frontend && npm install && npm run dev   # frontend on :5173
            ```

            ---

            ## After Launching

            1. Open the app and go to **Inboxes** → add a Gmail account via OAuth
            2. Create a campaign with sequences
            3. Add leads — the queue engine handles scheduling automatically
            4. Monitor sends in **Schedule** or via `GET /api/status`

            > **Docs:** [INSTALL.md](https://github.com/azowail/quickly/blob/main/docs/INSTALL.md) · [API.md](https://github.com/azowail/quickly/blob/main/docs/API.md) · [WEBHOOKS.md](https://github.com/azowail/quickly/blob/main/docs/WEBHOOKS.md)
