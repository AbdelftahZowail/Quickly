{% extends "base.html" %}
{% block title %}Leads{% endblock %}
{% block content %}
<h1>Leads</h1>
<p style="color: var(--muted); margin-bottom: 1.5rem;">All leads, status, and campaigns.</p>

<!-- Add/Edit Lead Form -->
<div class="card" style="max-width: 520px; margin-bottom: 2rem;">
  <h2 style="margin-top: 0;" id="form-title">Add Lead</h2>
  <form id="lead-form">
    <input type="hidden" id="lead-id" name="lead_id" value="">
    <div class="form-group">
      <label>Email *</label>
      <input type="email" name="email" id="lead-email" required placeholder="lead@example.com">
    </div>
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" id="lead-name" placeholder="Jane Doe">
    </div>
    <div class="form-group">
      <label>Custom fields (JSON, e.g. {"company": "Acme", "title": "CEO"})</label>
      <textarea name="custom_data" id="lead-custom" rows="3" placeholder='{"company": "", "title": ""}'></textarea>
    </div>
    <div class="form-group" id="status-group" style="display: none;">
      <label>Status</label>
      <select name="status" id="lead-status">
        <option value="active">active</option>
        <option value="unsubscribed">unsubscribed</option>
        <option value="bounced">bounced</option>
        <option value="replied">replied</option>
      </select>
    </div>
    <div class="form-group">
      <label>Assign to campaign (optional)</label>
      <select name="campaign_id" id="lead-campaign">
        <option value="">— None —</option>
      </select>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button type="submit" class="btn" id="submit-btn">Add lead</button>
      <button type="button" class="btn secondary" id="cancel-btn" style="display:none;" onclick="resetForm()">Cancel</button>
    </div>
  </form>
  <div id="form-message" style="margin-top: 0.75rem;"></div>
</div>

<!-- Leads List -->
<h2>All Leads</h2>
<div id="lead-list"></div>

{% endblock %}
{% block extra_js %}
<script>
function escapeHtml(s) { return (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let campaigns = [];
let isEditMode = false;

async function loadCampaigns() {
  try {
    const res = await fetch('/api/campaigns');
    campaigns = await res.json();
    const sel = document.getElementById('lead-campaign');
    sel.innerHTML = '<option value="">— None —</option>';
    campaigns.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });
  } catch (e) {
    console.error('Failed to load campaigns:', e);
  }
}

async function loadLeads() {
  const listEl = document.getElementById('lead-list');
  try {
    const res = await fetch('/api/leads');
    const leads = await res.json();
    if (!leads.length) {
      listEl.innerHTML = '<p class="card">No leads yet. Add one above.</p>';
      return;
    }
    listEl.innerHTML = '<table><thead><tr><th>Email</th><th>Name</th><th>Status</th><th>Custom</th><th></th></tr></thead><tbody></tbody></table>';
    const tbody = listEl.querySelector('tbody');
    leads.forEach(l => {
      const tr = document.createElement('tr');
      tr.dataset.leadId = l.id;
      const custom = l.custom_data && Object.keys(l.custom_data).length ? JSON.stringify(l.custom_data) : '—';
      tr.innerHTML = `
        <td class="mono">${escapeHtml(l.email)}</td>
        <td>${escapeHtml(l.name)}</td>
        <td><span class="badge ${l.status}">${l.status}</span></td>
        <td style="font-size:0.85rem;color:var(--muted)">${escapeHtml(custom)}</td>
        <td>
          <button type="button" class="btn secondary btn-edit-lead" data-lead='${JSON.stringify(l).replace(/'/g, "&apos;")}'>Edit</button>
          <button type="button" class="btn danger btn-delete-lead" data-lead-id="${l.id}" data-email="${escapeHtml(l.email)}" style="margin-left:0.5rem;">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    
    // Add event listeners
    tbody.querySelectorAll('.btn-edit-lead').forEach(btn => {
      btn.addEventListener('click', function() {
        const lead = JSON.parse(this.dataset.lead);
        editLead(lead);
      });
    });
    
    tbody.querySelectorAll('.btn-delete-lead').forEach(btn => {
      btn.addEventListener('click', function() {
        const leadId = this.dataset.leadId;
        const email = this.dataset.email;
        deleteLead(leadId, email);
      });
    });
  } catch (e) {
    listEl.innerHTML = '<p class="card" style="color: var(--danger);">Failed to load leads.</p>';
  }
}

function resetForm() {
  const form = document.getElementById('lead-form');
  form.reset();
  document.getElementById('lead-id').value = '';
  document.getElementById('lead-email').readOnly = false;
  document.getElementById('form-title').textContent = 'Add Lead';
  document.getElementById('submit-btn').textContent = 'Add lead';
  document.getElementById('cancel-btn').style.display = 'none';
  document.getElementById('status-group').style.display = 'none';
  document.getElementById('form-message').innerHTML = '';
  isEditMode = false;
}

function editLead(lead) {
  isEditMode = true;
  document.getElementById('form-title').textContent = 'Edit Lead';
  document.getElementById('submit-btn').textContent = 'Save changes';
  document.getElementById('cancel-btn').style.display = 'inline-block';
  document.getElementById('lead-id').value = lead.id;
  document.getElementById('lead-email').value = lead.email || '';
  document.getElementById('lead-email').readOnly = true;
  document.getElementById('lead-name').value = lead.name || '';
  document.getElementById('lead-custom').value = lead.custom_data && Object.keys(lead.custom_data).length
    ? JSON.stringify(lead.custom_data, null, 2)
    : '';
  document.getElementById('lead-status').value = lead.status || 'active';
  document.getElementById('status-group').style.display = 'block';
  document.getElementById('form-message').innerHTML = '';
  
  // Scroll to form
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteLead(leadId, email) {
  if (!confirm('Delete lead ' + email + '? This cannot be undone.')) return;
  try {
    const res = await fetch('/api/leads/' + leadId, { method: 'DELETE' });
    if (res.ok) {
      loadLeads();
      if (document.getElementById('lead-id').value === leadId.toString()) {
        resetForm();
      }
    } else {
      const data = await res.json();
      alert('Failed: ' + (data.detail || 'Unknown error'));
    }
  } catch (e) {
    alert('Failed to delete lead.');
  }
}

document.getElementById('lead-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const leadId = document.getElementById('lead-id').value;
  const msgEl = document.getElementById('form-message');
  
  let custom_data = {};
  try {
    const raw = document.getElementById('lead-custom').value.trim();
    if (raw) custom_data = JSON.parse(raw);
  } catch (err) {
    msgEl.innerHTML = '<span style="color:var(--danger)">Invalid JSON in custom fields.</span>';
    return;
  }
  
  msgEl.innerHTML = '';
  
  if (isEditMode && leadId) {
    // Update existing lead
    const res = await fetch('/api/leads/' + leadId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('lead-name').value.trim(),
        custom_data,
        status: document.getElementById('lead-status').value,
      }),
    });
    
    if (res.ok) {
      msgEl.innerHTML = '<span style="color:var(--success)">Lead updated.</span>';
      const campaignId = document.getElementById('lead-campaign').value;
      if (campaignId) {
        const addRes = await fetch('/api/campaigns/' + campaignId + '/leads/' + leadId, { method: 'POST' });
        if (addRes.ok) {
          msgEl.innerHTML = '<span style="color:var(--success)">Lead updated and assigned to campaign.</span>';
        }
      }
      setTimeout(() => {
        resetForm();
        loadLeads();
      }, 1000);
    } else {
      const text = await res.text();
      msgEl.innerHTML = '<span style="color:var(--danger)">Error: ' + escapeHtml(text) + '</span>';
    }
  } else {
    // Create new lead
    const body = {
      email: document.getElementById('lead-email').value.trim(),
      name: document.getElementById('lead-name').value.trim(),
      custom_data,
      campaign_id: document.getElementById('lead-campaign').value ? parseInt(document.getElementById('lead-campaign').value, 10) : null,
    };
    
    const res = await fetch('/api/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    
    if (res.ok) {
      const lead = await res.json();
      msgEl.innerHTML = '<span style="color:var(--success)">Lead added (id ' + lead.id + ').</span>';
      form.reset();
      loadLeads();
    } else {
      const text = await res.text();
      msgEl.innerHTML = '<span style="color:var(--danger)">Error: ' + escapeHtml(text) + '</span>';
    }
  }
});

// Initialize
loadCampaigns();
loadLeads();
</script>
{% endblock %}
