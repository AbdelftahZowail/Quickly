{% extends "base.html" %}
{% block title %}Inboxes{% endblock %}
{% block content %}

<!-- add button & header -->
<h1 style="margin-bottom:1rem;">
  Inboxes
  <button id="open-add" class="btn" style="float:right;">Add Inbox</button>
</h1>

<!-- add modal (hidden by default) -->
<div id="add-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
  <div class="card" style="max-width:520px; margin:2rem;">
    <h2 style="margin-top:0;">Add inbox</h2>
    <form id="add-inbox-form">
      <div class="form-group">
        <label>Provider</label>
        <select name="provider" id="add-provider">
          <option value="resend">Resend</option>
          <option value="smtp">SMTP</option>
          <option value="gmail">Gmail OAuth</option>
        </select>
      </div>
      <div class="form-group" id="email-group">
        <label>Email *</label>
        <input type="email" name="email" placeholder="sales@company.com">
      </div>
      <div class="form-group">
        <label>Display name</label>
        <input type="text" name="display_name" placeholder="Sales Team">
      </div>
      <div class="form-group">
        <label>Max emails per day</label>
        <input type="number" name="max_emails_per_day" value="50" min="1" max="1000">
      </div>
      <div class="form-group">
        <label>Wait between emails (minutes)</label>
        <input type="number" name="wait_minutes_between" value="5" min="1" max="120">
      </div>
      <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button type="submit" class="btn" id="add-inbox-btn">Add inbox</button>
        <button type="button" class="btn secondary" id="close-add">Cancel</button>
      </div>
      <div id="oauth-warning" style="display:none; margin-top: 0.75rem; padding: 0.75rem; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); border-radius: 4px; color: var(--text);">
        ⚠️ You have to enter your credentials in the <a href="/settings" style="color: var(--accent); text-decoration: underline;">settings</a>.
      </div>
    </form>
    <div id="form-message" style="margin-top: 0.75rem;"></div>
  </div>
</div>

<h2>Inbox list</h2>
<div id="inbox-list"></div>

<!-- Edit modal -->
<div id="edit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
  <div class="card" style="max-width:520px; margin:2rem;">
    <h2 style="margin-top:0;">Edit Inbox</h2>
    <form id="edit-inbox-form">
      <input type="hidden" id="edit-inbox-id" name="id">
      <div class="form-group">
        <label>Email (read-only)</label>
        <input type="email" id="edit-email" disabled>
      </div>
      <div class="form-group">
        <label>Display name</label>
        <input type="text" id="edit-display-name" name="display_name">
      </div>
      <div class="form-group">
        <label>Provider</label>
        <select id="edit-provider" name="provider">
          <option value="resend">Resend</option>
          <option value="smtp">SMTP</option>
          <option value="gmail">Gmail OAuth</option>
        </select>
      </div>
      <div class="form-group">
        <label>Max emails per day</label>
        <input type="number" id="edit-max-per-day" name="max_emails_per_day" min="1" max="1000">
      </div>
      <div class="form-group">
        <label>Wait between emails (minutes)</label>
        <input type="number" id="edit-wait-minutes" name="wait_minutes_between" min="1" max="120">
      </div>
      <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn secondary" onclick="closeEditModal()">Cancel</button>
      </div>
    </form>
    <div id="edit-message" style="margin-top:0.75rem;"></div>
  </div>
</div>

{% endblock %}
{% block extra_js %}
<script>
function escapeHtml(s) { return (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// OAuth configuration status
let oauthConfigured = false;

// Toggle form fields based on provider selection
const addProviderSelect = document.getElementById('add-provider');
const addInboxBtn = document.getElementById('add-inbox-btn');
const emailGroup = document.getElementById('email-group');
const emailInput = document.querySelector('#add-inbox-form input[name="email"]');
const oauthWarning = document.getElementById('oauth-warning');

function updateFormForProvider() {
  const isGmail = addProviderSelect.value === 'gmail';
  emailGroup.style.display = isGmail ? 'none' : '';
  emailInput.required = !isGmail;
  
  if (isGmail) {
    addInboxBtn.textContent = 'Connect with Google';
    if (!oauthConfigured) {
      addInboxBtn.disabled = true;
      addInboxBtn.style.opacity = '0.5';
      addInboxBtn.style.cursor = 'not-allowed';
      oauthWarning.style.display = 'block';
    } else {
      addInboxBtn.disabled = false;
      addInboxBtn.style.opacity = '1';
      addInboxBtn.style.cursor = 'pointer';
      oauthWarning.style.display = 'none';
    }
  } else {
    addInboxBtn.textContent = 'Add inbox';
    addInboxBtn.disabled = false;
    addInboxBtn.style.opacity = '1';
    addInboxBtn.style.cursor = 'pointer';
    oauthWarning.style.display = 'none';
  }
}
addProviderSelect.addEventListener('change', updateFormForProvider);

// Check OAuth status on page load
async function checkOAuthStatus() {
  try {
    const res = await fetch('/api/gmail/status');
    const data = await res.json();
    oauthConfigured = data.configured;
    const uriEl = document.getElementById('redirect-uri-display');
    if (uriEl) {
      uriEl.textContent = data.redirect_uri || 'http://localhost:8000/oauth/google/callback';
    }
    updateFormForProvider();
  } catch (e) {
    console.error('Failed to check Gmail OAuth status:', e);
  }
}

checkOAuthStatus();

// wire up modal open/close
const openAddBtn = document.getElementById('open-add');
const closeAddBtn = document.getElementById('close-add');
const addModal = document.getElementById('add-modal');
if (openAddBtn) {
  openAddBtn.addEventListener('click', () => {
    addModal.style.display = 'flex';
    // reset form state
    document.getElementById('add-inbox-form').reset();
    addProviderSelect.value = 'resend';
    updateFormForProvider();
    document.getElementById('form-message').innerHTML = '';
  });
}
if (closeAddBtn) {
  closeAddBtn.addEventListener('click', () => {
    addModal.style.display = 'none';
  });
}

async function loadInboxes() {
  const listEl = document.getElementById('inbox-list');
  try {
    const res = await fetch('/api/inboxes');
    const inboxes = await res.json();
    if (!inboxes.length) {
      listEl.innerHTML = '<p class="card">No inboxes yet. Add one above to use in campaigns.</p>';
      return;
    }
    listEl.innerHTML = '<table><thead><tr><th>Email</th><th>Display name</th><th>Provider</th><th>Max/day</th><th>Sent today</th><th>Wait (min)</th><th>Created</th><th></th></tr></thead><tbody></tbody></table>';
    const tbody = listEl.querySelector('tbody');
    inboxes.forEach(i => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mono">${escapeHtml(i.email)}</td>
        <td>${escapeHtml(i.display_name || '—')}</td>
        <td><span class="badge">${escapeHtml(i.provider || 'resend')}</span></td>
        <td>${i.max_emails_per_day}</td>
        <td>${(i.sent_today||0)} of ${i.max_emails_per_day}</td>
        <td>${i.wait_minutes_between || 5}</td>
        <td>${new Date(i.created_at).toLocaleDateString()}</td>
        <td>
          <button class="btn secondary" onclick='editInbox(${JSON.stringify(i)})'>Edit</button>
          <button class="btn danger" onclick="deleteInbox(${i.id}, '${escapeHtml(i.email).replace(/'/g, "\\'")}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    listEl.innerHTML = '<p class="card" style="color: var(--danger);">Failed to load inboxes.</p>';
  }
}

document.getElementById('add-inbox-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const msgEl = document.getElementById('form-message');
  const provider = form.provider.value;
  msgEl.innerHTML = '';

  // Gmail: redirect to OAuth flow
  if (provider === 'gmail') {
    const dn = form.display_name.value.trim();
    const mpd = parseInt(form.max_emails_per_day.value, 10) || 50;
    const params = new URLSearchParams({ display_name: dn, max_per_day: mpd });
    window.location.href = '/oauth/google/authorize?' + params.toString();
    return;
  }

  // Resend / SMTP: normal API create
  if (!form.email.value.trim()) {
    msgEl.innerHTML = '<span style="color: var(--danger)">Email is required.</span>';
    return;
  }
  const body = {
    email: form.email.value.trim(),
    display_name: form.display_name.value.trim(),
    provider: provider,
    max_emails_per_day: parseInt(form.max_emails_per_day.value, 10) || 50,
    wait_minutes_between: parseInt(form.wait_minutes_between.value, 10) || 5,
  };
  try {
    const res = await fetch('/api/inboxes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      msgEl.innerHTML = '<span style="color: var(--success)">Inbox added.</span>';
      form.reset();
      form.max_emails_per_day.value = 50;
      form.wait_minutes_between.value = 5;
      form.provider.value = 'resend';
      updateFormForProvider();
      loadInboxes();
      // hide modal now that it's done
      if (addModal) addModal.style.display = 'none';
    } else {
      const text = await res.text();
      msgEl.innerHTML = '<span style="color: var(--danger)">' + escapeHtml(text) + '</span>';
    }
  } catch (err) {
    msgEl.innerHTML = '<span style="color: var(--danger)">Request failed.</span>';
  }
});

function editInbox(inbox) {
  document.getElementById('edit-inbox-id').value = inbox.id;
  document.getElementById('edit-email').value = inbox.email;
  document.getElementById('edit-display-name').value = inbox.display_name || '';
  document.getElementById('edit-provider').value = inbox.provider || 'resend';
  document.getElementById('edit-max-per-day').value = inbox.max_emails_per_day;
  document.getElementById('edit-wait-minutes').value = inbox.wait_minutes_between || 5;
  document.getElementById('edit-message').innerHTML = '';
  document.getElementById('edit-modal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
}

document.getElementById('edit-inbox-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const msgEl = document.getElementById('edit-message');
  const inboxId = document.getElementById('edit-inbox-id').value;
  const body = {
    display_name: document.getElementById('edit-display-name').value.trim(),
    provider: document.getElementById('edit-provider').value,
    max_emails_per_day: parseInt(document.getElementById('edit-max-per-day').value, 10),
    wait_minutes_between: parseInt(document.getElementById('edit-wait-minutes').value, 10) || 5,
  };
  msgEl.innerHTML = '';
  try {
    const res = await fetch('/api/inboxes/' + inboxId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      msgEl.innerHTML = '<span style="color: var(--success)">Inbox updated.</span>';
      setTimeout(() => {
        closeEditModal();
        loadInboxes();
      }, 1000);
    } else {
      const text = await res.text();
      msgEl.innerHTML = '<span style="color: var(--danger)">' + escapeHtml(text) + '</span>';
    }
  } catch (err) {
    msgEl.innerHTML = '<span style="color: var(--danger)">Request failed.</span>';
  }
});

async function deleteInbox(id, email) {
  if (!confirm('Delete inbox "' + email + '"?')) return;
  const res = await fetch('/api/inboxes/' + id, { method: 'DELETE' });
  if (res.ok) {
    loadInboxes();
  } else {
    let msg = 'Error deleting inbox.';
    try {
      const data = await res.json();
      msg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail || data);
    } catch (_) {
      msg = await res.text() || msg;
    }
    alert(msg);
  }
}

loadInboxes();
</script>
{% endblock %}
